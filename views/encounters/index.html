{{- /* Встречи в дизайне dating2 (encounters.php макета). Колода грузится из /api/encounters (web/static/app.js),
   здесь — каркас, боковая колонка, окно «взаимно» и <template> карточки. Сверху колоды лежит ПОСЛЕДНЯЯ карточка
   в разметке (.card:nth-last-child в стилях). .me — текущий пользователь из контроллера. */ -}}
{{- $counts := counts .Ctx -}}
{{.View.SetTitle "Встречи"}}
<header class="page-head">
    <div>
        <h1>Встречи</h1>
        <p class="sub">Анкеты по вашим фильтрам: {{.me.AgeMin}}–{{.me.AgeMax}} лет, до {{.me.MaxKm}} км. Мы их не расширяем сами.</p>
    </div>
    <div class="page-head-end"><a class="btn btn-ghost btn-sm" href="/settings">{{icon "sliders" 17}} Фильтры</a></div>
</header>

<div class="enc" data-encounters data-premium="{{.me.IsPremium}}">
    <div class="deck-wrap">
        <div class="deck" aria-live="polite">
            <div class="deck-loading" data-loading><div class="skeleton"></div></div>
            <div class="empty" data-empty hidden>
                <h2>Анкеты закончились</h2>
                <p class="muted">По вашим фильтрам больше никого нет. Мы не расширяем их сами — поменяйте возраст или расстояние, если хотите увидеть больше людей.</p>
                <div class="row">
                    <a class="btn btn-primary" href="/settings">Изменить фильтры</a>
                    <a class="btn btn-ghost" href="/nearby">Люди рядом</a>
                </div>
            </div>
        </div>

        <div class="deck-actions" data-actions>
            <button class="act act-undo" type="button" data-undo title="Вернуть прошлую анкету{{if not .me.IsPremium}} (Premium){{end}}">
                {{icon "refresh" 20}}<span class="sr">Вернуть прошлую анкету</span>
            </button>
            <button class="act act-pass" type="button" data-pass>
                {{icon "x" 26}}<span class="sr">Не сейчас</span>
            </button>
            <button class="act act-like" type="button" data-like>
                {{icon "heart-filled" 30}}<span class="sr">Нравится</span>
            </button>
            <a class="act act-info" href="#" data-info title="Открыть анкету">
                {{icon "info" 20}}<span class="sr">Открыть анкету</span>
            </a>
        </div>

        <p class="keys-hint">Можно с клавиатуры: ← не сейчас, → нравится, Backspace — вернуть{{if not .me.IsPremium}} (Premium){{end}}.</p>
    </div>

    <aside class="enc-side">
        <div class="side-card">
            <h2>Ваш профиль</h2>
            <div class="side-row">
                <div class="ring" style="--p:{{.me.Filled}}"><i>{{.me.Filled}}%</i></div>
                <div>
                    {{- with .me.FillHint}}
                    <p class="small">{{.}}</p>
                    <a class="btn btn-quiet btn-sm" href="/me">Дозаполнить</a>
                    {{- else}}
                    <p class="small">Анкета заполнена — такие открывают чаще всего.</p>
                    <a class="btn btn-quiet btn-sm" href="/me">Открыть профиль</a>
                    {{- end}}
                </div>
            </div>
        </div>

        <div class="side-card">
            <h2>Вас отметили</h2>
            {{- if $counts.Likes}}
            <p class="small muted">{{$counts.Likes}} {{plural $counts.Likes "человек ждёт" "человека ждут" "человек ждут"}} вашего ответа.</p>
            {{- if .me.IsPremium}}
            <a class="btn btn-quiet btn-sm btn-block side-cta" href="/likes">{{icon "heart" 16}} Посмотреть</a>
            {{- else}}
            <a class="btn btn-premium btn-sm btn-block side-cta" href="/likes">{{icon "crown" 16}} Посмотреть</a>
            {{- end}}
            {{- else}}
            <p class="small muted">Пока никто. Симпатии появятся здесь, как только кто-то отметит вашу анкету.</p>
            {{- end}}
        </div>

        <div class="side-card">
            <h2>Как это работает</h2>
            <p class="small muted">
                Анкеты подбираются по вашим фильтрам и расстоянию. Человек узнает, что вы его отметили,
                только если отметит вас в ответ — тогда откроется переписка.
            </p>
        </div>
    </aside>
</div>

{{- /* «Это взаимно» — окно поверх колоды: смотреть дальше можно, не уходя со страницы */}}
<dialog class="modal modal-match" data-match-dialog aria-labelledby="match-t">
    <div class="match">
        <div class="match-pair">
            <span class="ava ava-lg"><img data-match-me src="{{.me.Avatar}}" alt=""></span>
            <span class="ava ava-lg"><img data-match-other alt=""></span>
        </div>
        <h2 class="match-t" id="match-t">Вы с <b data-match-name></b> отметили друг друга</h2>
        <p class="match-s">Теперь можно написать — первое сообщение лучше начинать не с «привет», а с чего-то из анкеты.</p>
        <div class="match-act">
            <a class="btn btn-primary btn-lg" data-match-chat href="#">{{icon "message" 19}} Написать первым</a>
            <button class="btn btn-quiet" type="button" data-match-close>Позже, смотреть дальше</button>
        </div>
    </div>
</dialog>

<template id="card-tpl">
    <article class="card">
        <div class="card-photos" data-shots></div>
        <div class="card-bars"></div>
        <div class="card-top">
            <span class="pill pill-glass" data-online hidden><i class="dot-online"></i>в сети</span>
            <span class="pill pill-glass" data-verified hidden>{{icon "shield" 13}}проверено</span>
        </div>
        <span class="stamp stamp-like">ДА</span>
        <span class="stamp stamp-pass">НЕТ</span>
        <div class="card-info">
            <h2 class="card-name"></h2>
            <p class="card-meta">{{icon "map-pin" 14}} <span data-meta></span></p>
            <p class="card-bio"></p>
            <ul class="chips"></ul>
            <a class="btn btn-quiet btn-sm" data-open href="#">{{icon "eye" 16}} Вся анкета</a>
        </div>
    </article>
</template>
