{{.View.SetTitle "Фото"}}

<section style="padding-top: 16px;">
    <form id="filters" class="am-filters" autocomplete="off">
        <div class="form-group">
            <label>Пол</label>
            <select name="gender" class="form-control">
                <option value="">Все</option>
                <option value="f">Женщины</option>
                <option value="m">Мужчины</option>
                <option value="x">Небинарные</option>
            </select>
        </div>
        <div class="form-group">
            <label>Какие</label>
            <select name="main" class="form-control">
                <option value="">Все фото</option>
                <option value="1">Только главные</option>
            </select>
        </div>
        <div class="form-group am-narrow" style="width:120px;">
            <label>ID пользователя</label>
            <input name="uid" type="number" class="form-control">
        </div>
        <div class="form-group am-auto"><label>&nbsp;</label><div class="am-inline">Всего: <b class="photos-count">0</b></div></div>
    </form>
</section>

<section style="min-height: 700px;">
    <div class="am-grid" id="photos_result"></div>
</section>

<script nonce="{{.Nonce}}">
    var list;
    $(function () {
        filters_from_url('#filters');
        list = scroll_list({
            url: '/control/photos/get-photos', tbody: '#photos_result', grid: true, count: '.photos-count',
            data: function () { var d = form_data('#filters'); filters_to_url(d); return d; },
            row: function (v) {
                return '<div class="am-grid-item" id="p' + v.id + '"><img class="am-zoom" loading="lazy" src="' + esc(v.file) + '" alt="">' +
                    '<div class="am-grid-body"><div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">' +
                    '<div>' + user_link(v.uid, v.name, v.banned) + ' ' + (GENDER_ICON[v.gender] || '') + (parseInt(v.verified) === 2 ? ' ✓' : '') + '</div>' +
                    '<button class="btn btn-sm btn-outline-danger ph-del" data-id="' + v.id + '" title="Удалить"><i class="fa fa-trash"></i></button></div></div></div>';
            }
        });
        list.reload();
        var timer = null;
        $('#filters').on('input', 'input', function () { clearTimeout(timer); timer = setTimeout(list.reload, 400); });
        $('#filters').on('change', 'select', list.reload);
        $('#filters').on('submit', function (e) { e.preventDefault(); });
        $(document).on('click', '.ph-del', function () {
            var id = $(this).data('id');
            confirm_action({ title: 'Удалить фото?', danger: true, ok: 'Удалить', message: 'Фото удалится из анкеты и из хранилища. Действие попадёт в журнал.' },
                function () { post('/control/photos/delete', { id: id }, function () { $('#p' + id).fadeOut(150); }); });
        });
    });
</script>
